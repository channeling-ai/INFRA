{{- if .Values.cloudflared.enabled }}
# cloudflared config.yaml
# - tunnel: 사용할 tunnel UUID
# - credentials-file: Secret에서 마운트된 경로
# - ingress: hostname → 내부 Service 라우팅 규칙
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: cloudflared
data:
  # metrics는 /ready probe할때 씀(원래는 Prometheus 메트릭 노출용 포트
  config.yaml: |
    tunnel: {{ .Values.cloudflared.tunnelId }}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true

    # outbound 연결 유지를 위한 옵션
    protocol: http2

    ingress:
      {{- range .Values.cloudflared.ingress }}
      - {{- if .hostname }}
        hostname: {{ .hostname }}
        {{- end }}
        service: {{ .service }}
        {{- if .path }}
        path: {{ .path }}
        {{- end }}
      {{- end }}
{{- end }}
