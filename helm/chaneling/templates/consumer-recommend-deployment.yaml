# 컨슈머는 Kafka에서 메시지를 끌어오는거지(Kafka Service가 라우팅) 누가 호출하는게 아님 -> Service 불필요
{{- if .Values.consumer.recommend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-recommend
  labels:
    {{- include "chaneling.labels" . | nindent 4 }}
    app.kubernetes.io/component: consumer-recommend
spec:
  replicas: {{ .Values.consumer.recommend.replicaCount }}
  selector:
    matchLabels:
      {{- include "chaneling.selectorLabels" (dict "Release" .Release "component" "consumer-recommend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chaneling.labels" . | nindent 8 }}
        app.kubernetes.io/component: consumer-recommend
    spec:
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- include "chaneling.antiAffinity" (dict "component" "consumer-recommend") | nindent 8 }}
      containers:
        - name: consumer
          image: "{{ .Values.consumer.image.repository }}:{{ .Values.consumer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: {{ toJson .Values.consumer.recommend.command }}
          env:
            {{- include "chaneling.commonEnv" . | nindent 12 }}
            {{- include "chaneling.llmEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.consumer.resources | nindent 12 }}
{{- end }}
