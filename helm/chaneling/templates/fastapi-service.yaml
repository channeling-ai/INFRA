{{- if .Values.fastapi.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  labels:
    {{- include "chaneling.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
spec:
  type: {{ .Values.fastapi.service.type }}
  ports:
    - name: http
      port: {{ .Values.fastapi.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "chaneling.selectorLabels" (dict "Release" .Release "component" "fastapi") | nindent 4 }}
{{- end }}
