{{- if .Values.sse.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: sse
  labels:
    {{- include "chaneling.labels" . | nindent 4 }}
    app.kubernetes.io/component: sse
spec:
  type: {{ .Values.sse.service.type }}
  ports:
    - name: http
      port: {{ .Values.sse.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "chaneling.selectorLabels" (dict "Release" .Release "component" "sse") | nindent 4 }}
{{- end }}
