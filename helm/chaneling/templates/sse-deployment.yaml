{{- if .Values.sse.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sse
  labels:
    {{- include "chaneling.labels" . | nindent 4 }}
    app.kubernetes.io/component: sse
spec:
  replicas: {{ .Values.sse.replicaCount }}
  selector:
    matchLabels:
      {{- include "chaneling.selectorLabels" (dict "Release" .Release "component" "sse") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chaneling.labels" . | nindent 8 }}
        app.kubernetes.io/component: sse
    spec:
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: sse
          image: "{{ .Values.sse.image.repository }}:{{ .Values.sse.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.sse.service.port }}
              protocol: TCP
          env:
            {{- include "chaneling.commonEnv" . | nindent 12 }}
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.config.springProfilesActive | quote }}
          resources:
            {{- toYaml .Values.sse.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: {{ .Values.sse.probes.startup.path }}
              port: {{ .Values.sse.probes.startup.port }}
            periodSeconds: {{ .Values.sse.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.sse.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.sse.probes.liveness.path }}
              port: {{ .Values.sse.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.sse.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sse.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.sse.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.sse.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.sse.probes.readiness.path }}
              port: {{ .Values.sse.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.sse.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.sse.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.sse.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.sse.probes.readiness.failureThreshold }}
{{- end }}
