{{- if .Values.spring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: spring
  labels:
    {{- include "chaneling.labels" . | nindent 4 }}
    app.kubernetes.io/component: spring
spec:
  type: {{ .Values.spring.service.type }}
  ports:
    - name: http
      port: {{ .Values.spring.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "chaneling.selectorLabels" (dict "Release" .Release "component" "spring") | nindent 4 }}
{{- end }}
