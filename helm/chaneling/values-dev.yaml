################################################################################
# chaneling · dev overrides
#
# dev 노드는 1 OCPU × 2 (총 2 OCPU)뿐이라:
#   1. CPU/메모리 request를 base보다 보수적으로 축소
#   2. nodeSelector 해제 → 양 노드 다 사용 (Node-1의 여유 CPU 활용)
#   limit은 base 그대로 → burst 가능
################################################################################

# 양 노드 다 사용 가능 (dev only). prod에선 base values의 role=app-tier 유지
# ⚠️ {} 가 아니라 null 이어야 함. Helm 딥머지에서 빈 맵({})은 base의 role=app-tier를
#    "덮어쓰기"가 아니라 "병합"해서 못 지움 → 그대로 app-tier 유지됨(모든 app 파드가 node-2로 몰림).
#    null 로 명시해야 base 값이 실제로 제거되어 후보 노드가 양쪽으로 열림.
global:
  nodeSelector: null
  # dev-latest mutable 태그라 캐시 무시하고 매번 pull. prod에선 IfNotPresent 유지 (base).
  imagePullPolicy: Always
config:
  frontUrl: "https://chaneling.com"
  env: "dev"
  # dev는 OCI Object Storage를 S3 호환 API로 사용. region은 OCI 춘천.
  # endpoint override는 시크릿 AWS_ENDPOINT_URL_S3로 주입됨.
  awsRegion: "ap-chuncheon-1"
spring:
  image:
    tag: dev-f602375
  resources:
    requests: {cpu: "100m", memory: "512Mi"}
    limits: {cpu: "500m", memory: "1Gi"}
fastapi:
  image:
    tag: dev-f0e457a
  resources:
    requests: {cpu: "100m", memory: "384Mi"}
    limits: {cpu: "400m", memory: "768Mi"}
sse:
  image:
    tag: dev-1332c94
  resources:
    requests: {cpu: "50m", memory: "192Mi"}
    limits: {cpu: "200m", memory: "384Mi"}
consumer:
  image:
    tag: dev-f0e457a
  resources:
    requests: {cpu: "40m", memory: "192Mi"}
    limits: {cpu: "200m", memory: "384Mi"}
