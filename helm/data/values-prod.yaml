################################################################################
# data · prod overrides
################################################################################

postgres:
  resources:
    requests: { cpu: "300m", memory: "768Mi" }
    limits:   { cpu: "800m", memory: "1.5Gi" }
  persistence:
    size: 20Gi
  config:
    sharedBuffers: "512MB"
    maxConnections: 200

kafka:
  resources:
    requests: { cpu: "400m", memory: "1Gi" }
    limits:   { cpu: "1000m", memory: "2Gi" }
  persistence:
    size: 20Gi
  heapOpts: "-Xms768m -Xmx768m"

redis:
  persistence:
    size: 2Gi
  passwordEnabled: true   # prod는 비번 필수
