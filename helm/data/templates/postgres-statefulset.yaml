{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
# Deployment vs StatefulSet
# =================================
# Deployment
# 모든 pod들을 동등하게 생각함
# pod 이름, ip 생성할때마다 바뀜(spring-abc-xyz1, spring-abc-xyz2)
# pod끼리 구분할 필요 x, 그냥 Service가 라운드로빈으로 대충 pod들에게 트래픽 분배
# Stateless에는 완벽
# 하지만 DB는 pod끼리 구분 필요(1개는 primary, 2개는 standby, 근데 누가 primary?)
# 재시작시에도 역할 유지 필요
# 데이터(PVC)도 각자 자기거 유지해야됨 
# =================================
# StatefulSet
# 4가지를 보장함
# (1) 안정적 pod 이름(postgres-0, postgres-1, postgres-0이 죽고 재생성돼도 이름 postgres-0)
# (2) 안정적 DNS (pod마다 자기 전용 DNS가 있음, postgres-0만 지정해서 호출할 수 있음)
# (3) 안정적 storage (pod마다 전용 PVC 자동 생성 postgres-0 -> data-postgres-0, postgres-0이 죽었다 재생성돼도 data-postgres-0에 다시 마운트)
# (4) 순차적 배포 (0 -> 1 -> 2 순서 생성 가능, primary 생성 후 standby 생성 순서 보장 가능, 삭제도 마찬가지. Deployment는 병렬이라 이딴거 없음)
# =================================
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "data.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres-headless    # StatefulSet은 headless Service 필수 (안정적 DNS)
  replicas: 1
  selector:
    matchLabels:
      {{- include "data.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "data.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      nodeSelector:
        {{- toYaml .Values.global.nodeSelector | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: PG_PASSWORD
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF-8 --locale=C"
            # data 디렉토리를 PVC 마운트 하위로 변경 (postgres가 마운트 루트에 lost+found 있으면 에러)
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          args:
            - postgres
            - "-c"
            - "shared_buffers={{ .Values.postgres.config.sharedBuffers }}"
            - "-c"
            - "max_connections={{ .Values.postgres.config.maxConnections }}"
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    # apiVersion/kind는 K8s ServerSideApply가 default로 채움 → 미리 박아야 ArgoCD diff 안 남
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.global.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
