{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "data.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
  selector:
    {{- include "data.selectorLabels" (dict "Release" .Release "component" "redis") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  labels:
    {{- include "data.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: redis
  selector:
    {{- include "data.selectorLabels" (dict "Release" .Release "component" "redis") | nindent 4 }}
{{- end }}
