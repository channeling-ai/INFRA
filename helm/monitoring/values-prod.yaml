################################################################################
# monitoring · prod overrides
# prod도 2 OCPU만 있어 app-tier(node-2) 빡빡 → monitoring을 data-tier로
# Loki는 S3 stateless라 어느 노드든 OK
################################################################################

nodeSelector:
  role: data-tier

loki:
  retentionPeriod: "720h"   # 30일
  resources:
    requests: { cpu: "150m", memory: "384Mi" }
    limits:   { cpu: "500m", memory: "768Mi" }

grafana:
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: "100m", memory: "192Mi" }
    limits:   { cpu: "300m", memory: "384Mi" }
