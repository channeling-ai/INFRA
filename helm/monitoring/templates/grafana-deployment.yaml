{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "monitoring.selectorLabels" (dict "Release" .Release "component" "grafana") | nindent 6 }}
  strategy:
    # RollingUpdate -> 롤링 업데이트 / Recreate -> 한 번에 다 죽이고 다 생성함
    type: Recreate    # PVC가 RWO(Read Write Once, 동시에 1개 pod만 마운트 가능)라 Pod 2개 동시 운영 불가
  template:
    metadata:
      labels:
        {{- include "monitoring.labels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
      annotations:
        checksum/datasources: {{ include (print $.Template.BasePath "/grafana-configmap.yaml") . | sha256sum }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      # Grafana 컨테이너가 472 uid로 실행 → PVC 디렉토리 권한 조정
      securityContext:
        fsGroup: 472
        runAsUser: 472
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: GRAFANA_ADMIN_PASSWORD
            - name: GF_USERS_ALLOW_SIGN_UP
              value: {{ .Values.grafana.allowSignUp | quote }}
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
{{- end }}
