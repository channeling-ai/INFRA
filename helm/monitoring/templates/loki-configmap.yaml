{{- if .Values.loki.enabled }}
# Loki config (단일 binary 모드, S3 백엔드)
# - chunks: OCI Object Storage (S3 호환 API)
# - index: boltdb-shipper (로컬 cache + S3 동기화)
# - 인증 비활성: 클러스터 내부 트래픽만이라 OK
# - ${...} 변수는 컨테이너 env로 주입, -config.expand-env=true로 치환됨
apiVersion: v1
# loki, promtail, grafana는 yaml 파일로 동작함
# loki -> loki.yaml / grafana -> datasources.yaml / promtail -> promtail.yaml
# 이걸 configmap으로 관리함(k8s 리소스로 관리)
# pod 시작할 때 이걸 파일로 만들어서 마운트함 
kind: ConfigMap
metadata:
  name: loki-config
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095

    common:
      path_prefix: /loki
      storage:
        s3:
          endpoint: ${LOKI_S3_ENDPOINT}
          bucketnames: ${LOKI_S3_BUCKET}
          region: ${LOKI_S3_REGION}
          access_key_id: ${LOKI_S3_ACCESS_KEY}
          secret_access_key: ${LOKI_S3_SECRET_KEY}
          s3forcepathstyle: {{ .Values.loki.s3.forcePathStyle }}
          insecure: false
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    limits_config:
      retention_period: {{ .Values.loki.retentionPeriod }}
      reject_old_samples: true
      reject_old_samples_max_age: {{ .Values.loki.retentionPeriod }}
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/compactor
      delete_request_store: s3
      retention_enabled: true

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules
{{- end }}
