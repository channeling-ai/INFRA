{{- if .Values.grafana.enabled }}
# Grafana datasource를 ConfigMap으로 자동 provisioning
# Grafana 부팅 시 /etc/grafana/provisioning/datasources/ 안의 yaml 자동 등록
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    {{- include "monitoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: {{ .Values.grafana.defaultDatasource.name }}
        type: loki
        access: proxy
        url: {{ .Values.grafana.defaultDatasource.url }}
        isDefault: true
        editable: false
{{- end }}
