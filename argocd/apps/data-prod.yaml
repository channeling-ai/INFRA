################################################################################
# data · ArgoCD Application (prod)
################################################################################
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: data-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://github.com/channeling-ai/INFRA.git
    targetRevision: main
    path: helm/data
    helm:
      releaseName: data
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: data
  # StatefulSet의 volumeClaimTemplates가 만든 PVC는 git에 없는 게 정상.
  # K8s가 owner reference로 SS와 묶어서 관리하므로 ArgoCD는 무시해야 영구 OutOfSync 안 됨.
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
        - /metadata
        - /status
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
